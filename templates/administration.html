{% extends 'base.html' %}
{% block title %}
    Log in
{% endblock %}

{% block content %}
    <section id="administration" class="container-fluid pt-5">

        {% if message_erreur %}
            <div class="alert alert-danger" role="alert">
                {{ message_erreur }}
            </div>
        {% endif %}

        <h1 class="text-center">Authentification</h1>
        <div id="administration-form">
            <form action="{{ url_for('administration') }}" method="POST">
                <div class="row mb-3">
                    <label for="emailAuth" class="col-sm-4 col-form-label">Email</label>
                    <div class="col-sm-8">
                        <input type="email" name="emailAuth" class="form-control" id="emailAuth" value="{{ emailAuth }}">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="motdepasseAuth" class="col-sm-4 col-form-label">Mot de passe</label>
                    <div class="col-sm-8">
                        <input type="password" name="motdepasseAuth" class="form-control" id="motdepasseAuth">
                    </div>
                </div>
                <div class="mb-3 form-check text-end">
                    <a href="{{ url_for('forget_password') }}">Mot de passe oublié?</a>
                </div>
                <div class="row">
                    <div class="col-sm-4"></div>
                    <div class="col-sm-8">
                        <input type="submit" class="btn btn-primary" value="Se connecter">
                    </div>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
