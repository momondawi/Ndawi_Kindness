{% extends 'base-admin.html' %}
{% block title %}
    Recherche de bénévoles
{% endblock %}

{% block content %}
    <section id="recherche-benevoles" class="container-fluid pt-5">
        <h1 class="text-center">Recherche de bénévoles/candidats au bénévolat</h1>
        <div id="recherche-form">
            <form id="form-recherche">
                <div class="row mb-3">
                    <label for="nom" class="col-sm-2 col-form-label">Nom</label>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="nom" placeholder="Entrez un nom">
                    </div>
                    <label for="prenom" class="col-sm-2 col-form-label">Prénom</label>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" id="prenom" placeholder="Entrez un prénom">
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12 text-center">
                        <button type="button" id="btn-rechercher" class="btn btn-primary">Rechercher</button>
                    </div>
                </div>
            </form>
        </div>
        <div id="resultats" class="mt-5">
            <h3>Résultats</h3>
            <ul id="liste-resultats" class="list-group"></ul>
            <div id="pagination" class="mt-3">
                <button class="btn btn-secondary" id="btn-prev" disabled>Précédent</button>
                <button class="btn btn-secondary" id="btn-next" disabled>Suivant</button>
            </div>
        </div>
    </section>
{% endblock %}
