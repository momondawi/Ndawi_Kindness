{% extends 'base-admin.html' %}
{% block title %}
    Modifier Candidat
{% endblock %}

{% block content %}
    <section id="updatecandidat" class="container-fluid pt-5">
        <div id="message-erreur" class="alert alert-danger" role="alert" style="display: none;"></div>

        <h1 class="text-center">Modification du candidat</h1>
        <div id="updatecandidat-form-container">
            <form id="updatecandidat-form" data-id="{{ candidat.id }}">
                <div class="row mb-3">
                    <label for="nomcandidat" class="col-sm-4 col-form-label">Nom</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="nomcandidat" value="{{ candidat.nom }}" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="prenomcandidat" class="col-sm-4 col-form-label">Prénom</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="prenomcandidat" value="{{ candidat.prenom }}" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="emailcandidat" class="col-sm-4 col-form-label">Email</label>
                    <div class="col-sm-8">
                        <input type="email" class="form-control" id="emailcandidat" value="{{ candidat.courriel }}" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="adressecandidat" class="col-sm-4 col-form-label">Adresse</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="adressecandidat" value="{{ candidat.adresse }}" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="telephonecandidat" class="col-sm-4 col-form-label">Téléphone</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="telephonecandidat" value="{{ candidat.telephone }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-4"></div>
                    <div class="col-sm-8">
                        <button type="button" class="btn btn-success" id="btn-update">Modifier</button>
                        <a href="{{ url_for('candidate_system') }}" class="btn btn-danger">Annuler</a>
                    </div>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
